# TYPE  DATABASE  USER         ADDRESS          METHOD
# مدیریت: سوکت محلی برای root/postgres (peer) و بقیه با رمز
local   all       postgres                      peer
local   all       all                           scram-sha-256
# نقش‌های داخلی پنل فقط از خود دستگاه؛ از شبکه رد می‌شوند
host    all       pgpro_admin  127.0.0.1/32     scram-sha-256
host    all       pgpro_admin  ::1/128          scram-sha-256
host    all       pgpro_admin  0.0.0.0/0        reject
host    all       pgpro_admin  ::/0             reject
host    all       pgpro_panel  127.0.0.1/32     scram-sha-256
host    all       pgpro_panel  ::1/128          scram-sha-256
host    all       pgpro_panel  0.0.0.0/0        reject
host    all       pgpro_panel  ::/0             reject
# پایگاه‌های کاربران: خود دستگاه و شبکه‌های خصوصی (QGIS و ArcGIS از رایانه‌ها)؛ هرگز از اینترنت عمومی
host    all       all          127.0.0.1/32     scram-sha-256
host    all       all          ::1/128          scram-sha-256
host    all       all          10.0.0.0/8       scram-sha-256
host    all       all          172.16.0.0/12    scram-sha-256
host    all       all          192.168.0.0/16   scram-sha-256
host    all       all          169.254.0.0/16   scram-sha-256
host    all       all          fe80::/10        scram-sha-256
host    all       all          fd00::/8         scram-sha-256
