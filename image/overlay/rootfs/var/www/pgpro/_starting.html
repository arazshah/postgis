<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="5">
<title>pgpro — در حال آماده‌سازی</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#EDF1ED;color:#0F2E33;font-family:Vazirmatn,Tahoma,system-ui,sans-serif;text-align:center;padding:16px}
  main{max-width:440px;background:#fff;border:1px solid #D5DDD7;border-radius:14px;padding:28px 24px}
  h1{font-size:22px;margin:0 0 8px}
  p{margin:8px 0;line-height:1.9;color:#40585C}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#0F5C59;animation:b 1.2s infinite ease-in-out}
  @keyframes b{0%,100%{opacity:.25}50%{opacity:1}}
</style>
</head>
<body>
<main>
  <p><span class="dot"></span></p>
  <h1>pgpro در حال آماده‌سازی است</h1>
  <p>اولین روشن شدن چند دقیقه طول می‌کشد (ساخت رمزهای یکتا و پایگاه داده). بعد از هر روشن شدن بعدی حدود یک دقیقه.</p>
  <p>این صفحه خودش هر چند ثانیه تازه می‌شود؛ دستگاه را خاموش نکنید.</p>
</main>
</body>
</html>
