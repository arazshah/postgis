<svg viewBox="0 0 540 300" width="130mm" xmlns="http://www.w3.org/2000/svg" font-family="Vazirmatn" font-size="11" text-anchor="middle">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#7b8789"/></marker></defs>
  <!-- کاربران -->
  <g><rect x="420" y="20" width="110" height="260" rx="12" fill="#f3f5f5"/><text x="475" y="42" font-weight="700" font-size="12.5" fill="#0a4f50">کاربر و نرم‌افزار</text>
    <rect x="432" y="58" width="86" height="34" rx="8" fill="#fff" stroke="#c9d2d2"/><text x="475" y="79">مرورگر</text>
    <rect x="432" y="102" width="86" height="34" rx="8" fill="#fff" stroke="#c9d2d2"/><text x="475" y="123">QGIS / ArcGIS</text>
    <rect x="432" y="146" width="86" height="34" rx="8" fill="#fff" stroke="#c9d2d2"/><text x="475" y="167">برنامه‌ی وب و موبایل</text>
    <rect x="432" y="190" width="86" height="34" rx="8" fill="#fff" stroke="#c9d2d2"/><text x="475" y="211">Python / Node.js</text>
    <rect x="432" y="234" width="86" height="34" rx="8" fill="#fff" stroke="#c9d2d2"/><text x="475" y="255">گیرنده‌ی GNSS</text></g>
  <!-- لایه‌ی سرویس -->
  <g><rect x="200" y="20" width="190" height="260" rx="12" fill="#e3f1ef"/><text x="295" y="42" font-weight="700" font-size="12.5" fill="#0a4f50">سرویس ابری</text>
    <rect x="214" y="58" width="162" height="34" rx="8" fill="#fff"/><text x="295" y="79">پنل وب: مرور، SQL، تحلیل، نقشه</text>
    <rect x="214" y="102" width="162" height="34" rx="8" fill="#fff"/><text x="295" y="123">کاشی برداری MVT و OGC API</text>
    <rect x="214" y="146" width="162" height="34" rx="8" fill="#fff"/><text x="295" y="167">WMS / WFS (QGIS Server)</text>
    <rect x="214" y="190" width="162" height="34" rx="8" fill="#fff"/><text x="295" y="211">REST API و همگام‌سازی میدانی</text>
    <rect x="214" y="234" width="162" height="34" rx="8" fill="#fff"/><text x="295" y="255">تصویر ماهواره‌ای، بکاپ، کارهای پس‌زمینه</text></g>
  <!-- پایگاه داده -->
  <g><rect x="10" y="20" width="170" height="260" rx="12" fill="#0f6e6e"/><text x="95" y="42" font-weight="700" font-size="12.5" fill="#fff">پایگاه داده‌ی شما</text>
    <ellipse cx="95" cy="84" rx="58" ry="12" fill="#e3f1ef"/><rect x="37" y="84" width="116" height="96" fill="#e3f1ef"/><ellipse cx="95" cy="180" rx="58" ry="12" fill="#cfe7e3"/>
    <text x="95" y="116" font-weight="700" fill="#0a4f50" font-size="13">PostgreSQL</text><text x="95" y="136" fill="#0a4f50">+ PostGIS</text><text x="95" y="156" fill="#4a5759" font-size="10">جدول، هندسه، رستر، شاخص</text>
    <rect x="30" y="206" width="130" height="26" rx="6" fill="#ffffff22"/><text x="95" y="223" fill="#fff">PgBouncer (اتصال)</text>
    <rect x="30" y="240" width="130" height="26" rx="6" fill="#ffffff22"/><text x="95" y="257" fill="#fff">SSL · نقش‌ها · سهمیه</text></g>
  <line x1="430" y1="75" x2="380" y2="75" stroke="#7b8789" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="430" y1="163" x2="380" y2="120" stroke="#7b8789" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="430" y1="251" x2="380" y2="210" stroke="#7b8789" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="210" y1="140" x2="160" y2="140" stroke="#7b8789" stroke-width="1.4" marker-end="url(#ar)"/>
  <path d="M432,119 C330,290 220,300 160,220" fill="none" stroke="#b8741a" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#ar)"/>
  <path d="M432,207 C350,295 230,298 165,232" fill="none" stroke="#b8741a" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#ar)"/>
  <text x="300" y="295" font-size="10" fill="#b8741a">اتصال مستقیم PostgreSQL (پورت پایگاه، SSL)</text>
</svg>
