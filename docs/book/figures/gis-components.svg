    <g><line x1="312" y1="185" x2="388" y2="222" stroke="#c9d2d2" stroke-width="2"/>
      <rect x="370" y="200" width="140" height="44" rx="10" fill="#e3f1ef"/><text x="440" y="220" font-weight="700" fill="#0a4f50">سخت‌افزار و ابر</text><text x="440" y="237" font-size="11" fill="#4a5759">سرور، GNSS، ماهواره</text></g>
