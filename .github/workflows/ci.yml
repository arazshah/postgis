name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      panel-db:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: panel
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_TESTING: "1"
      DATABASE_URL: postgres://postgres:postgres@localhost:5434/panel
      TEST_PG_HOST: localhost
      TEST_PG_PORT: "5432"
      TEST_PG_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: sudo apt-get update -q && sudo apt-get install -y -q gdal-bin
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Tests (unit + PostGIS integration)
        run: python manage.py test -v 2

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t geopaygah:ci .
      - name: Backup tools present in image
        run: docker run --rm --entrypoint sh geopaygah:ci -c "pg_dump --version && pg_restore --version && ogr2ogr --version"
      - name: Smoke test container
        run: |
          docker run -d --name app -p 8000:8000 \
            -e DJANGO_SECRET_KEY=ci -e DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1 geopaygah:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/healthz && exit 0; sleep 2; done
          docker logs app; exit 1
      - name: Coolify compose stack (web + worker + qgis + panel-db)
        env:
          SERVICE_PASSWORD_POSTGRES: ci-panel-pass
          DJANGO_SECRET_KEY: ci-secret
          CREDENTIALS_ENCRYPTION_KEY: ci-enc
          DJANGO_SUPERUSER_PASSWORD: Ci-Admin-Pass-123
        run: |
          docker network create coolify || true
          docker compose -f docker-compose.yml up -d --build
          for i in $(seq 1 40); do
            if docker compose -f docker-compose.yml exec -T web curl -fsS http://127.0.0.1:8000/healthz; then
              docker compose -f docker-compose.yml exec -T web python manage.py shell -c \
                "from accounts.models import User; assert User.objects.filter(username='admin', is_superuser=True).exists(); print('admin ok')"
              # QGIS Server: پروژه‌ای که web در volume مشترک می‌نویسد باید از کانتینر qgis خوانده شود
              docker compose -f docker-compose.yml exec -T web sh -c \
                "printf '%s' '<qgis version=\"3.34.4\" projectname=\"ci\"><title>ci</title><projectlayers/><properties><WMSServiceCapabilities type=\"bool\">true</WMSServiceCapabilities></properties></qgis>' > /app/ows/ci.qgs && chmod 640 /app/ows/ci.qgs"
              for j in $(seq 1 20); do
                if docker compose -f docker-compose.yml exec -T web curl -fsS "http://qgis/ows/?MAP=/app/ows/ci.qgs&SERVICE=WMS&REQUEST=GetCapabilities" | grep -q WMS_Capabilities; then
                  echo "qgis ok"; exit 0
                fi
                sleep 3
              done
              docker compose -f docker-compose.yml logs qgis; exit 1
            fi
            sleep 3
          done
          docker compose -f docker-compose.yml logs; exit 1
