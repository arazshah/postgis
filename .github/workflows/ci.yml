name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    timeout-minutes: 45
    # ubuntu-latest صرف‌نظر از نسخه‌ی ۲۴.۰۴ به ۲۶.۰۴ رسیده و pg_dump/pg_restore آن جدیدتر از سرور آزمون (PostgreSQL 16) است؛
    # آرشیوش «SET transaction_timeout» دارد و روی ۱۶ بازگردانی نمی‌شود. ۲۴.۰۴ همان کلاینت ۱۶ را دارد.
    runs-on: ubuntu-24.04
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      panel-db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: panel
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_TESTING: "1"
      DATABASE_URL: postgres://postgres:postgres@localhost:5434/panel
      TEST_PG_HOST: localhost
      TEST_PG_PORT: "5432"
      TEST_PG_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: System packages (GDAL، osmium، pgbouncer؛ اختیاری)
        # آزمون‌هایی که به این ابزارها نیاز دارند با shutil.which خودشان skip می‌شوند؛ پس نبودن شبکه‌ی اوبونتو روی رانر
        # (که گاهی DNS آن خراب است و apt نیم‌ساعت می‌ماند) نباید کل اجرا را بخواباند یا شکست بدهد.
        continue-on-error: true
        timeout-minutes: 8
        run: |
          if ! timeout 10 getent hosts archive.ubuntu.com >/dev/null; then
            echo "::warning::DNS مخزن اوبونتو روی این رانر کار نمی‌کند؛ نصب GDAL/osmium/pgbouncer رد شد و آزمون‌های وابسته skip می‌شوند."
            exit 0
          fi
          echo "http://archive.ubuntu.com/ubuntu/ priority:1" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          APT="-o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
          for i in 1 2 3; do
            if timeout 120 sudo apt-get update -q $APT \
               && timeout 240 sudo apt-get install -y -q --fix-missing $APT gdal-bin osmium-tool osm2pgrouting pgbouncer gettext-base; then
              exit 0
            fi
            echo "::warning::تلاش $i برای نصب بسته‌ها ناموفق بود"; sleep 20
          done
          exit 0
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Architecture dependency rules
        run: lint-imports
      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Tests (unit + PostGIS integration)
        run: python manage.py test -v 2

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t geopaygah:ci .
      - name: Backup tools present in image
        run: docker run --rm --entrypoint sh geopaygah:ci -c "pg_dump --version && pg_restore --version && ogr2ogr --version && osmium --version && osm2pgrouting --version && pmtiles version"
      - name: Smoke test container
        run: |
          docker run -d --name app -p 8000:8000 \
            -e DJANGO_SECRET_KEY=ci -e DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1 geopaygah:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/healthz && exit 0; sleep 2; done
          docker logs app; exit 1
      - name: Coolify compose stack (web + worker + qgis + panel-db)
        env:
          SERVICE_PASSWORD_POSTGRES: ci-panel-pass
          DJANGO_SECRET_KEY: ci-secret
          CREDENTIALS_ENCRYPTION_KEY: ci-enc
          DJANGO_SUPERUSER_PASSWORD: Ci-Admin-Pass-123
        run: |
          docker network create coolify || true
          docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
          for i in $(seq 1 40); do
            if docker compose -f docker-compose.yml -f docker-compose.build.yml exec -T -u app web curl -fsS http://127.0.0.1:8000/healthz; then
              docker compose -f docker-compose.yml -f docker-compose.build.yml exec -T -u app web python manage.py shell -c \
                "from accounts.models import User; assert User.objects.filter(username='admin', is_superuser=True).exists(); print('admin ok')"
              # QGIS Server: پروژه‌ای که web در volume مشترک می‌نویسد باید از کانتینر qgis خوانده شود
              docker compose -f docker-compose.yml -f docker-compose.build.yml exec -T -u app web sh -c \
                "printf '%s' '<qgis version=\"3.34.4\" projectname=\"ci\"><title>ci</title><projectlayers/><properties><WMSServiceCapabilities type=\"bool\">true</WMSServiceCapabilities></properties></qgis>' > /app/ows/ci.qgs && chmod 640 /app/ows/ci.qgs"
              for j in $(seq 1 20); do
                if docker compose -f docker-compose.yml -f docker-compose.build.yml exec -T -u app web curl -fsS "http://qgis/ows/?MAP=/app/ows/ci.qgs&SERVICE=WMS&REQUEST=GetCapabilities" | grep -q WMS_Capabilities; then
                  echo "qgis ok"; exit 0
                fi
                sleep 3
              done
              docker compose -f docker-compose.yml -f docker-compose.build.yml logs qgis; exit 1
            fi
            sleep 3
          done
          docker compose -f docker-compose.yml -f docker-compose.build.yml logs; exit 1

  # دروازه‌ی ماهواره (روی سرور خارجی) مستقل از ایمیج برنامه ساخته و منتشر می‌شود؛
  # به pmtiles، GDAL پنل یا job docker وابسته نیست، پس خرابی آن‌ها جلوی انتشار دروازه را نمی‌گیرد.
  satgate:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build satgate image
        run: docker build -f satgate/Dockerfile -t satgate:ci .
      - name: Satgate starts and answers health
        run: |
          docker run -d --name sg -p 8080:8080 -e SATGATE_SECRET=ci satgate:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/v1/health && exit 0; sleep 2; done
          docker logs sg; exit 1
      - name: Image can really read and write rasters (rasterio + GDAL + numpy)
        run: |
          docker run --rm --entrypoint python satgate:ci -c "
          import numpy as np, rasterio, rasterio.warp, rasterio.windows, rasterio.merge
          from rasterio.enums import Resampling
          from rasterio.transform import from_origin
          p = '/tmp/t.tif'
          with rasterio.open(p, 'w', driver='GTiff', width=64, height=64, count=1, dtype='float32', crs='EPSG:4326',
                             transform=from_origin(51, 36, .001, .001), tiled=True, blockxsize=16, blockysize=16,
                             compress='DEFLATE', predictor=3) as d:
              d.write(np.ones((64, 64), 'float32'), 1)
          with rasterio.open(p) as s:
              print(rasterio.__version__, s.read(1, out_shape=(32, 32), resampling=Resampling.bilinear).mean())
          from satgate import process, app
          "
      - name: Unsigned requests are rejected
        run: test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/jobs/$(printf 'a%.0s' $(seq 32)))" = 401

  publish-satgate:
    runs-on: ubuntu-latest
    needs: [test, satgate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (lowercase)
        run: echo "IMG=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build and push satgate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: satgate/Dockerfile
          push: true
          tags: |
            ${{ env.IMG }}-satgate:latest
            ${{ env.IMG }}-satgate:${{ github.sha }}
          cache-from: type=gha,scope=satgate
          cache-to: type=gha,mode=max,scope=satgate

  # ساخت و انتشار ایمیج‌ها در GHCR (فقط بعد از سبز شدن main)؛ Coolify همین ایمیج‌ها را pull می‌کند
  publish:
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names (lowercase)
        run: echo "IMG=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build and push app (web + worker)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMG }}:latest
            ${{ env.IMG }}:${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: Build and push qgis
        uses: docker/build-push-action@v6
        with:
          context: docker/qgis
          push: true
          tags: |
            ${{ env.IMG }}-qgis:latest
            ${{ env.IMG }}-qgis:${{ github.sha }}
          cache-from: type=gha,scope=qgis
          cache-to: type=gha,mode=max,scope=qgis
      - name: Build and push pgbouncer
        uses: docker/build-push-action@v6
        with:
          context: docker/pgbouncer
          push: true
          tags: |
            ${{ env.IMG }}-pgbouncer:latest
            ${{ env.IMG }}-pgbouncer:${{ github.sha }}
          cache-from: type=gha,scope=pgbouncer
          cache-to: type=gha,mode=max,scope=pgbouncer
      # اختیاری: اگر Secretهای COOLIFY_DEPLOY_WEBHOOK و COOLIFY_TOKEN تنظیم شده باشند، بعد از آماده شدن ایمیج‌ها دیپلوی را راه می‌اندازد
      - name: Trigger Coolify deploy
        env:
          HOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -n "$HOOK" ] && [ -n "$TOKEN" ]; then
            curl -fsS --retry 3 -H "Authorization: Bearer $TOKEN" "$HOOK"
          else
            echo "Coolify webhook تنظیم نشده؛ دیپلوی را دستی بزنید."
          fi
