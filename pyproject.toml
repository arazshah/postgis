[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B904"]

# قاعده‌ی وابستگی معماری (docs/adr/0004). اجرا: lint-imports
# قرارداد «هسته» قطعی است؛ بقیه چرخ‌دنده‌اند: فهرست ignore فقط باید کوتاه شود.
[tool.importlinter]
root_packages = [
    "kernel", "accounts", "analysis", "analytics", "assistant", "billing", "classroom", "core", "databases",
    "dbtables", "dbsql", "dbfind", "dbimport", "dbhealth", "dbbackup", "dbusage", "dbteam", "ext",
    "enterprise", "iranmap", "jobs", "kb", "maps", "notifications", "publish", "restapi", "satellite", "satgate",
    "support", "survey", "tools",
]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "هسته به هیچ پلاگینی وابسته نیست"
type = "forbidden"
source_modules = ["kernel"]
forbidden_modules = [
    "accounts", "analysis", "analytics", "assistant", "billing", "classroom", "core", "databases", "enterprise",
    "iranmap", "jobs", "kb", "maps", "notifications", "publish", "restapi", "satellite", "satgate", "support",
    "survey", "tools", "dbtables", "dbsql", "dbfind", "dbimport", "dbhealth", "dbbackup", "dbusage", "dbteam", "ext",
]
ignore_imports = ["kernel.tests.** -> **"]
unmatched_ignore_imports_alerting = "none"
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "صف کارها پلاگین‌های قابلیت را نمی‌شناسد"
type = "forbidden"
source_modules = ["jobs"]
forbidden_modules = [
    "analysis", "classroom", "enterprise", "iranmap", "satellite", "tools", "maps", "publish", "survey", "restapi",
    "dbtables", "dbsql", "dbfind", "dbimport", "dbhealth", "dbbackup", "dbusage", "dbteam",
]
ignore_imports = ["jobs.tests.** -> **"]
unmatched_ignore_imports_alerting = "none"
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "اعلان‌ها پلاگین‌های قابلیت را نمی‌شناسد"
type = "forbidden"
source_modules = ["notifications"]
forbidden_modules = [
    "analysis", "classroom", "enterprise", "iranmap", "satellite", "tools", "maps", "publish", "survey", "restapi",
    "dbtables", "dbsql", "dbfind", "dbimport", "dbhealth", "dbbackup", "dbusage", "dbteam",
]
ignore_imports = ["notifications.tests.** -> **"]
unmatched_ignore_imports_alerting = "none"
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "ابزارها فقط SDK را می‌شناسند (نه موتور، نما یا اپ‌های دیگر)"
type = "forbidden"
source_modules = ["tools.plugins"]
forbidden_modules = [
    "tools.engine", "tools.views", "tools.catalog", "databases", "analysis", "jobs", "core", "accounts", "maps",
    "publish", "notifications",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "سایت و قاب پنل (core) پلاگین‌های دیگر را نمی‌شناسد، جز حساب، پایگاه و پایگاه دانش"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = [
    "analysis", "analytics", "assistant", "billing", "classroom", "enterprise", "iranmap", "jobs", "maps",
    "notifications", "publish", "restapi", "satellite", "satgate", "support", "survey", "tools",
    "dbtables", "dbsql", "dbfind", "dbimport", "dbhealth", "dbbackup", "dbusage", "dbteam",
]
ignore_imports = ["core.tests.** -> **"]
unmatched_ignore_imports_alerting = "none"
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "پلاگین‌ها فقط از دروازه‌های هسته به داده‌ی مشتری، رمزنگاری و دسترسی فضای کار می‌رسند"
type = "forbidden"
source_modules = [
    "analysis", "tools", "maps", "publish", "restapi", "survey", "satellite", "iranmap", "enterprise", "classroom", "jobs",
    "billing", "core", "kb", "support", "accounts", "analytics",
]
forbidden_modules = [
    "databases.explorer", "databases.team", "databases.crypto", "databases.gdal", "databases.provisioner",
    "databases.services", "databases.views", "databases.defaults", "databases.csvgeo", "databases.gateway",
    "databases.forms", "databases.urls",
    # بخش‌های داده پلاگین جدا هستند و هیچ پلاگین دیگری درونشان را نمی‌شناسد
    "dbtables", "dbsql", "dbfind", "dbimport", "dbhealth", "dbbackup", "dbusage", "dbteam",
]
ignore_imports = [
    "analysis.tests.** -> **", "tools.tests.** -> **", "maps.tests.** -> **", "publish.tests.** -> **",
    "restapi.tests.** -> **", "survey.tests.** -> **", "satellite.tests.** -> **", "iranmap.tests.** -> **",
    "enterprise.tests.** -> **", "classroom.tests.** -> **", "jobs.tests.** -> **", "billing.tests.** -> **",
    "core.tests.** -> **", "kb.tests.** -> **", "support.tests.** -> **", "accounts.tests.** -> **",
    "analytics.tests.** -> **",
]
unmatched_ignore_imports_alerting = "none"
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "تنظیم و اجرای پرسش فارسی (nl2sql) فقط برای تحلیل است؛ پروفایل زبانه‌اش را از رجیستری می‌گیرد"
type = "forbidden"
source_modules = [
    "accounts", "billing", "classroom", "core", "enterprise", "iranmap", "jobs", "kb", "maps", "notifications",
    "publish", "restapi", "satellite", "support", "survey", "tools", "analytics", "assistant",
    "dbtables", "dbfind", "dbimport", "dbhealth", "dbbackup", "dbusage", "dbteam",
]
forbidden_modules = ["databases.nl2sql"]
ignore_imports = [
    "accounts.tests.** -> **", "billing.tests.** -> **", "classroom.tests.** -> **", "core.tests.** -> **",
    "enterprise.tests.** -> **", "iranmap.tests.** -> **", "jobs.tests.** -> **", "kb.tests.** -> **",
    "maps.tests.** -> **", "notifications.tests.** -> **", "publish.tests.** -> **", "restapi.tests.** -> **",
    "satellite.tests.** -> **", "support.tests.** -> **", "survey.tests.** -> **", "tools.tests.** -> **",
    "analytics.tests.** -> **", "assistant.tests.** -> **",
]
unmatched_ignore_imports_alerting = "none"
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "پلاگین‌های سیستمی پلاگین‌های قابلیت را نمی‌شناسند (فقط برعکس)"
type = "forbidden"
source_modules = [
    "accounts", "core", "databases", "jobs", "billing", "support", "notifications", "kb", "assistant", "analytics",
]
forbidden_modules = [
    "analysis", "tools", "maps", "publish", "restapi", "survey", "iranmap", "classroom", "enterprise", "satellite",
    "dbtables", "dbsql", "dbfind", "dbimport", "dbhealth", "dbbackup", "dbusage", "dbteam", "ext",
]
ignore_imports = [
    "accounts.tests.** -> **", "core.tests.** -> **", "databases.tests.** -> **", "jobs.tests.** -> **",
    "billing.tests.** -> **", "support.tests.** -> **", "notifications.tests.** -> **", "kb.tests.** -> **",
    "assistant.tests.** -> **", "analytics.tests.** -> **",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "بخش‌های داده از هم مستقل‌اند (هیچ‌کدام دیگری را نمی‌شناسد)"
type = "independence"
modules = ["dbtables", "dbsql", "dbfind", "dbimport", "dbhealth", "dbbackup", "dbusage", "dbteam"]
ignore_imports = [
    "dbtables.tests.** -> **", "dbsql.tests.** -> **", "dbfind.tests.** -> **", "dbimport.tests.** -> **",
    "dbhealth.tests.** -> **", "dbbackup.tests.** -> **", "dbusage.tests.** -> **", "dbteam.tests.** -> **",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "بخش‌های داده نما، مسیر، مانیفست و پنل میزبانی را نمی‌شناسند و پلاگین قابلیت دیگری را هم نه"
type = "forbidden"
source_modules = ["dbtables", "dbsql", "dbfind", "dbimport", "dbhealth", "dbbackup", "dbusage", "dbteam"]
forbidden_modules = [
    "databases.views", "databases.urls", "databases.plugin", "databases.gateway", "databases.admin", "databases.admin_cards",
    "databases.home", "databases.defaults",
    "analysis", "tools", "maps", "publish", "restapi", "survey", "iranmap", "classroom", "enterprise", "satellite",
]
ignore_imports = [
    "dbtables.tests.** -> **", "dbsql.tests.** -> **", "dbfind.tests.** -> **", "dbimport.tests.** -> **",
    "dbhealth.tests.** -> **", "dbbackup.tests.** -> **", "dbusage.tests.** -> **", "dbteam.tests.** -> **",
]
unmatched_ignore_imports_alerting = "none"
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "پلاگین سطح ۳ (ext) فقط SDK هسته و مدل‌های مجاز را می‌شناسد (docs/adr/0007)"
type = "forbidden"
source_modules = ["ext"]
forbidden_modules = [
    "accounts.views", "accounts.admin", "analysis", "analytics", "assistant", "billing", "classroom", "core", "databases.views",
    "databases.urls", "databases.plugin", "databases.gateway", "databases.admin", "databases.explorer", "databases.team",
    "enterprise", "iranmap", "jobs", "kb", "maps", "notifications", "publish", "restapi", "satellite", "satgate", "support",
    "survey", "tools", "dbtables", "dbsql", "dbfind", "dbimport", "dbhealth", "dbbackup", "dbusage", "dbteam",
    "kernel.crypto", "kernel.pkg", "kernel.runner", "kernel.admin", "kernel.studio", "kernel.pluginio", "kernel.pkgtest",
    "kernel.health", "kernel.alerts", "kernel.admin_cards", "kernel.stepup",
]
ignore_imports = ["ext.**.tests.** -> **"]
unmatched_ignore_imports_alerting = "none"
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "پلاگین‌های سطح ۳ از هم مستقل‌اند"
type = "independence"
modules = ["ext.*"]
unmatched_ignore_imports_alerting = "none"
