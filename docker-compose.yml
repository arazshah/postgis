# شاخه‌ی pgpro-web فقط سایت pgpro.ir است (هرگز به main ادغام نمی‌شود).
# Coolify: Build Pack = Docker Compose ، Base Directory = / ، Docker Compose Location = /docker-compose.yml
# دامنه‌ها روی سرویس web (پورت 80): https://pgpro.ir و https://www.pgpro.ir
# بدون دیتابیس، بدون رمز و بدون پورت میزبان؛ سایت در pgpro-site/ است (README همان‌جا).
services:
  web:
    build:
      context: ./pgpro-site
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_WEB_80
      # مقصد هدایت /update/* (پیش‌فرض: Release گیت‌هاب pgpro-latest)
      - PGPRO_RELEASE_BASE=${PGPRO_RELEASE_BASE:-https://github.com/arazshah/postgis/releases/download/pgpro-latest}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
      - /etc/nginx/conf.d
    security_opt:
      - no-new-privileges:true
